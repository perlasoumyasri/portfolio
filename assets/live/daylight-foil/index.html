<style>/* UX Gym — design tokens */
:root {
  /* Brand — used like a weapon, not decoration */
  --orange: #FF450F;
  --orange-ink: #B82F08;   /* WCAG-safe orange on light bg */
  --orange-wash: #FFEEEA;
  --orange-glow: rgba(255, 69, 15, 0.14);

  /* Surfaces — warm, gym-quiet, not sterile */
  --bg: #F7F4EE;            /* page background */
  --surface: #FFFFFF;       /* cards */
  --surface-2: #F1ECE2;     /* subtle elevation / nested */
  --surface-dark: #0E0D0B;  /* atmospheric / hero moments */
  --surface-dark-2: #1A1714;

  /* Ink */
  --ink: #15110D;
  --ink-2: #6B6358;         /* secondary */
  --ink-3: #A8A095;         /* tertiary */
  --ink-on-dark: #FAF8F3;
  --ink-on-dark-2: #B8B0A2;

  /* Borders */
  --line: #EAE3D5;
  --line-strong: #D8CFBD;
  --line-dark: rgba(255,255,255,0.08);

  /* Type — body/UI grotesque, editorial serif, mono for metrics */
  --font-ui: 'Geist', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-display: 'Instrument Serif', 'Times New Roman', Georgia, serif;
  --font-mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;

  /* Radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-xl: 22px;
  --r-2xl: 32px;

  /* Shadows — restrained, Linear-style */
  --shadow-sm: 0 1px 2px rgba(20,15,10,0.04), 0 1px 0 rgba(20,15,10,0.02);
  --shadow-md: 0 4px 12px rgba(20,15,10,0.05), 0 1px 2px rgba(20,15,10,0.04);
  --shadow-lg: 0 24px 48px -16px rgba(20,15,10,0.18), 0 6px 16px rgba(20,15,10,0.06);
}

/* Reset just inside artboards */
.uxg, .uxg * {
  box-sizing: border-box;
}
.uxg {
  font-family: var(--font-ui);
  color: var(--ink);
  background: var(--bg);
  width: 100%;
  height: 100%;
  font-feature-settings: 'ss01', 'cv11';
  -webkit-font-smoothing: antialiased;
  font-smooth: always;
  letter-spacing: -0.005em;
}

/* Type utilities */
.uxg .display-xl   { font-family: var(--font-display); font-weight: 400; font-size: 144px; line-height: 0.92; letter-spacing: -0.04em; }
.uxg .display-l    { font-family: var(--font-display); font-weight: 400; font-size: 96px;  line-height: 0.94; letter-spacing: -0.035em; }
.uxg .display-m    { font-family: var(--font-display); font-weight: 400; font-size: 64px;  line-height: 0.98; letter-spacing: -0.03em; }
.uxg .display-s    { font-family: var(--font-display); font-weight: 400; font-size: 44px;  line-height: 1.02; letter-spacing: -0.02em; }
.uxg .h1           { font-weight: 600; font-size: 36px; line-height: 1.08; letter-spacing: -0.022em; }
.uxg .h2           { font-weight: 600; font-size: 24px; line-height: 1.18; letter-spacing: -0.018em; }
.uxg .h3           { font-weight: 600; font-size: 18px; line-height: 1.3;  letter-spacing: -0.012em; }
.uxg .body-l       { font-weight: 400; font-size: 19px; line-height: 1.6;  letter-spacing: -0.008em; }
.uxg .body         { font-weight: 400; font-size: 15px; line-height: 1.55; letter-spacing: -0.005em; }
.uxg .body-s       { font-weight: 400; font-size: 13.5px; line-height: 1.5; letter-spacing: -0.003em; }
.uxg .caption      { font-weight: 500; font-size: 11.5px; line-height: 1.3; letter-spacing: 0.1em; text-transform: uppercase; }
.uxg .mono         { font-family: var(--font-mono); font-feature-settings: 'tnum','zero'; }
.uxg .mono-l       { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.02em; }
.uxg .mono-s       { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.04em; }
.uxg .it           { font-style: italic; }

/* Element niceties */
.uxg button { font-family: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; padding: 0; }
.uxg a { color: inherit; text-decoration: none; }
.uxg p { margin: 0; }
.uxg h1, .uxg h2, .uxg h3, .uxg h4 { margin: 0; font-weight: inherit; }

/* Flame mark */
.uxg .flame {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: linear-gradient(180deg, #FFB47A 0%, var(--orange) 55%, #C2350A 100%);
  display: inline-flex; align-items: center; justify-content: center;
  color: white;
  box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 4px 10px rgba(255,69,15,0.25);
  flex: 0 0 auto;
}

/* Bigger flame variant */
.uxg .flame-lg { width: 32px; height: 32px; border-radius: 9px; }

/* Generic chip */
.uxg .chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 12px; font-weight: 500;
  color: var(--ink-2);
}
.uxg .chip-orange {
  background: var(--orange-wash);
  border-color: rgba(255,69,15,0.22);
  color: var(--orange-ink);
}
.uxg .chip-dark {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.12);
  color: var(--ink-on-dark);
}

/* Buttons */
.uxg .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 18px;
  border-radius: 10px;
  font-weight: 500; font-size: 14px;
  transition: transform .12s, box-shadow .15s, background .15s;
}
.uxg .btn-primary {
  background: var(--orange);
  color: white;
  box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 6px 14px -2px rgba(255,69,15,0.32);
}
.uxg .btn-primary:hover { transform: translateY(-1px); }
.uxg .btn-ghost {
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line-strong);
}
.uxg .btn-dark {
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid rgba(255,255,255,0.12);
}

/* Streak flame dot */
.uxg .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; display:inline-block; }

/* Scrollbar reset within artboards */
.uxg::-webkit-scrollbar, .uxg *::-webkit-scrollbar { display: none; }
.uxg, .uxg * { scrollbar-width: none; }
</style>
