<script>var PokemonApp = window.PokemonApp;
(function () {
  var q = new URLSearchParams(location.search),
    T = (q.get('type') || 'EYE').toUpperCase(),
    P = window.POKEMON,
    H = window.PK2Card.HeroCard;
  var st = document.createElement('style');
  st.textContent = 'html,body,#root,body>div{background:transparent!important;background-image:none!important}';
  document.head.appendChild(st);
  var el = document.getElementById('root');
  document.documentElement.style.background = 'transparent';
  document.body.style.background = 'transparent';

  document.body.style.overflow = 'hidden';
  el.style.cssText = 'height:100vh;display:flex;align-items:center;justify-content:center;background:transparent';
  var one = function one(t) {
    return React.createElement(H, {
      arch: P.ARCH[t],
      score: P.computeResult(P.sampleAnswersFor(t)).score,
      name: '',
      photoUrl: null,
      prm: false,
      minting: q.get('mint') === '1',
      alive: true
    });
  };
  if (T === 'ALL') {

    ReactDOM.createRoot(el).render(React.createElement(React.Fragment, null, P.TYPES.map(function (t) {
      return React.createElement('div', {
        key: t,
        style: {
          cursor: 'zoom-in'

        onClick: function onClick(e) {

      }, one(t));
    })));
  } else {

      id: 'pkc'

  }
})();</script>
